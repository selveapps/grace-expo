version = "1.0"

[metadata]
author_name = "selve"
difficulty = "medium"
category = "state-sync"
source = "https://github.com/selveapps/grace-expo/pull/83"

[verifier]
timeout_sec = 600

[agent]
timeout_sec = 1800
# The model cannot reach the network while it edits. Setup and the
# verifier still can. This is the SWE-bench Pro v2 rule.
network_mode = "no-network"

[environment]
build_timeout_sec = 1800
cpus = 2
memory_mb = 4096
storage_mb = 10240
